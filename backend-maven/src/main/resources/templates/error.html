<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Codec Technologies EMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container max-w-4xl">
        <div class="card error-card">
            <div class="card-body text-center p-5">
                <div class="error-icon">🛑</div>
                <h1 th:text="${errorTitle != null ? errorTitle : 'Application Error'}">403 - Access Denied</h1>
                <p class="error-msg" th:text="${errorMessage != null ? errorMessage : 'The requested resource or operation could not be authorized.'}">
                    You do not have permission to access this page or resource.
                </p>
                <div class="mt-4">
                    <a th:href="@{/dashboard}" class="btn btn-primary">&larr; Return to Dashboard</a>
                    <a th:href="@{/employees}" class="btn btn-secondary">Go to Employee Directory</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
